# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - ai-startup-idea-generator

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # دمجنا أوامر التجهيز كلها في خطوة واحدة جوه الباك إند
      - name: Install dependencies and build
        working-directory: backend
        run: |
          npm install
          npm run build --if-present

      # خطوة الضغط: بنضغط محتويات الباك إند وبنعمل الملف المضغوط في المسار الرئيسي
      - name: Zip deployment package
        working-directory: backend
        run: zip -r ../deployment.zip .

      # بنرفع الملف المضغوط الجاهز اللي بقى موجود في المسار الرئيسي
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deployment.zip 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_737E64BEC84C4EC1B3976C049373E997 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2E63EB55312547DE9F76D25A1D085701 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8480333443E94C9789675A9087A206F1 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ai-startup-idea-generator'
          slot-name: 'Production'
          # بنوجه Azure يعمل ديبلوى للملف المضغوط مباشرة
          package: deployment.zip